# Optional Docker Hub alternative only. RunPod GitHub import builds the image
# directly and does not use this workflow. If needed, copy it to the GitHub
# repository's root .github/workflows/ directory.
name: Optional Docker Hub build for MediaPipe GPU test worker

on:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Linux x86-64 worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./detection/mediapipe_gpu_test_service/runpod_worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/arcs-mediapipe-gpu-test:${{ github.sha }}
